# Project: czech-tabloid-scraper
# File: Cargo.toml
# Description: Rust package and minimal dependency declarations.
# Author: Jan Alexandr Kopřiva
# License: MIT

[package]
name = "czech-tabloid-scraper"
version = "1.0.0"
edition = "2021"
authors = ["Jan Alexandr Kopřiva <jan.alexandr.kopriva@gmail.com>"]
license = "MIT"
description = "Collect headlines from 18 Czech RSS and Atom feeds"

[[bin]]
name = "bulvar_scraper"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "socks", "system-proxy", "cookies"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
roxmltree = "0.21"
regex = "1"
chardetng = "0.1"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
